name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Format check with ruff
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        # Coverage is reported for visibility, not gated: a hard threshold on
        # a young codebase invites test-padding instead of honest tests.
        run: pytest -q --tb=short --cov=alpha_engine --cov-report=term
      - name: Check installed web assets
        if: matrix.python-version == '3.12'
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          with ZipFile(next(Path('dist').glob('alpha_engine-*.whl'))) as wheel:
              names = set(wheel.namelist())
          for asset in ('index.html', 'research.html', 'research.js', 'style.css'):
              assert f'alpha_engine/web/static/{asset}' in names, asset
          PY
