# Alpha Engine — Docker Compose
# Usage:
#   docker compose run --rm engine scan BTC        # single scan
#   docker compose run --rm engine scan-all        # scan all assets
#   docker compose up dashboard                     # launch web dashboard
#   docker compose run --rm engine backtest BTC     # run backtest

services:
  # The CLI engine — run any command
  engine:
    build: .
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data        # persist cache and signal logs
    environment:
      - FRED_API_KEY=${FRED_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_API_BASE=${LLM_API_BASE:-https://api.openai.com/v1}
      - BREEZE_API_KEY=${BREEZE_API_KEY:-}
      - BREEZE_API_SECRET=${BREEZE_API_SECRET:-}
      - BREEZE_CLIENT_ID=${BREEZE_CLIENT_ID:-}
      - BREEZE_USER_ID=${BREEZE_USER_ID:-}
      - BREEZE_SESSION_TOKEN=${BREEZE_SESSION_TOKEN:-}
      - ANGEL_ONE_API_KEY=${ANGEL_ONE_API_KEY:-}
      - ANGEL_ONE_CLIENT_ID=${ANGEL_ONE_CLIENT_ID:-}
      - ANGEL_ONE_ACCESS_TOKEN=${ANGEL_ONE_ACCESS_TOKEN:-}

  # Web app — dashboard, AI terminal, and the HTTP/MCP API
  #
  # `--allow-public` is required because the server refuses to bind a
  # non-loopback address unauthenticated. Inside a container 0.0.0.0 is the only
  # reachable bind, and the real boundary is the port mapping below — change
  # `8000:8000` to `127.0.0.1:8000:8000` to keep it on this machine.
  #
  # Exposing it beyond localhost: set ALPHA_API_KEY and drop --allow-public, and
  # every API call then needs `Authorization: Bearer $ALPHA_API_KEY`.
  dashboard:
    build: .
    command: ["dashboard", "--host", "0.0.0.0", "--port", "8000", "--allow-public"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Set this to require auth; the server drops --allow-public's leniency
      # the moment a key is present.
      - ALPHA_API_KEY=${ALPHA_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./strategies:/app/strategies:ro   # your own strategies, read-only
    profiles:
      - dashboard

  # Batch scanner — run via cron or manually
  batch:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["batch", "--output", "/app/data/reports/batch.json"]
    volumes:
      - ./data:/app/data
    environment:
      - FRED_API_KEY=${FRED_API_KEY:-}
    profiles:
      - batch
  

