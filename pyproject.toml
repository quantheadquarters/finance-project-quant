[project]
name = "alpha-engine"
version = "0.5.0"
description = "An open, deterministic research engine that turns market data into structured, confidence-scored signals, with a 504-factor library, joint stock+options backtesting, source health monitoring and paper-first execution. Research and education only, not investment advice."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shubh Jain" }]
keywords = ["quantitative-finance", "research", "backtesting", "market-data", "deterministic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
# One runtime dependency, on purpose. Every network call goes through ~60 lines
# of urllib (`net.py`) rather than requests; RSS is parsed with xml.etree; the
# MCP server speaks JSON-RPC directly. Fewer moving parts is fewer things that
# break unattended six months from now.
dependencies = [
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/quantheadquarters/finance-project-quant"
Repository = "https://github.com/quantheadquarters/finance-project-quant"
Changelog = "https://github.com/quantheadquarters/finance-project-quant/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
# Browser-rendering tests. Deliberately NOT in `dev`: it pulls a ~150 MB browser
# and turns a millisecond suite into a multi-second one, and the rest of the
# tests are fast and network-free so they can run on every save. Install this
# before shipping a frontend change:
#     pip install -e ".[browser]" && playwright install chromium
browser = [
    "playwright>=1.40",
]

[project.scripts]
alpha-engine = "alpha_engine.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The dashboard/terminal frontend is plain files with no build step, so it has
# to be declared as package data or the wheel ships a web server with no pages.
# This is the other half of moving web/ inside the package: before the move,
# `pip install alpha-engine` gave you the CLI but no dashboard, terminal or
# HTTP API, and `alpha-engine dashboard` failed with advice that could not work.
[tool.setuptools.package-data]
"alpha_engine.web" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set explicitly instead of inheriting ruff's default.
#
# `dev` asks for `ruff>=0.4`, so CI always installs the newest ruff. When 0.16
# widened the default selection, 62 findings appeared across files nobody had
# touched and CI went red for three consecutive runs (2026-07-25) with no commit
# responsible. Pinning the ruff *version* would only move the problem to the next
# upgrade; naming the rules makes the gate reproducible forever.
#
# This is ruff's historical default — the rules this codebase was written and
# reviewed against. Widening it is a deliberate, separate piece of work: turn on
# one family, fix what it finds, commit. Do not widen it in a feature branch.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# Ruff 0.16 also began formatting python blocks inside markdown. The comment
# columns in HOW_IT_WORKS.md and docs/analyzer-guide.md are aligned by hand
# because they are teaching material — the formatter collapses that alignment
# and makes the tables harder to read, which is the opposite of the point.
exclude = ["*.md"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
reportPrivateImportUsage = false
reportGeneralTypeIssues = true
reportOptionalMemberAccess = true
reportOptionalSubscript = true
reportOptionalCall = true
